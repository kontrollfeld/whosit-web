# SPDX-FileCopyrightText: 2026 Kontrollfeld GmbH
# SPDX-License-Identifier: AGPL-3.0-or-later
# Typecheck, licence boundary and the full integration test suite.
#
# This private GitLab project is where development happens; the public GitHub and openCode copies
# are read-only push mirrors. That is why the full pipeline lives here and ONLY here — and why no
# job in it writes to the repository: a mirror is force-updated on every sync, so a commit created
# by CI would be lost, or would leave the mirror silently diverged.
#
# GitHub carries a deliberately reduced counterpart (.github/workflows/pr-checks.yml): the same
# checks, `pull_request` only, no write permissions — so a contributor sees whether their patch
# holds up before a maintainer ports it here.
#
# Why a verifying pipeline at all: until 2026-08-19 there was none. The only automation bumped the
# version and triggered the deploy — so every push to the default branch went to production
# untested. In a public repository that takes merge requests from strangers, that is not an option.

default:
  image: node:22
  # `npm ci` on a cold runner is the slowest part of the pipeline; the cache makes repeat runs cheap.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - test
  - image
  - betrieb

# Without this, every push to a branch with an open merge request produces TWO pipelines (one for
# the branch, one for the MR) — the same work twice, and two sets of results to interpret.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ─────────────────────────────────────────────────────────────────────────────────────────
test:
  stage: test
  # The suite starts real server processes and waits for WebSocket messages; on a cold runner that
  # is slower than locally. The limit stops a hung run from burning an hour of runner time.
  timeout: 20 minutes
  script:
    - npm run typecheck

    # This repository is AGPL only: no commercially licensed file, no import of a module. The
    # commercially licensed features are modules in repositories of their own.
    - npm run check:licence-boundary

    # The capability list in .env.selfhost.example is generated from the registry. Checked
    # rather than trusted: a stale list tells a self-hoster to switch off a capability that is
    # no longer called that — and an unknown id is ignored, so they would never find out.
    - npm run check:env-features

    # No executable code from anyone else's server — see the script's header for what that cost.
    - npm run check:no-external-scripts

    - npm run build

    # The QES end-to-end tests check the core TOGETHER with the qes-device module (commercially
    # licensed, not in this repository), down to a valid PAdES signature. Installed from the
    # modules group's npm registry with this job's token — nothing that expires. The module
    # projects allow this project's job token (Settings → CI/CD → Job token permissions). If the
    # install fails, the two tests say so and skip; everything else still runs.
    - |
      mkdir -p .modules
      # Its own package.json makes .modules the project root for npm — without it npm walks up to
      # the core's package.json, ignores .modules/.npmrc and asks registry.npmjs.org.
      echo '{"private":true}' > .modules/package.json
      printf '@whosit:registry=%s/groups/144814503/-/packages/npm/\n%s/groups/144814503/-/packages/npm/:_authToken=%s\n' "$CI_API_V4_URL" "${CI_API_V4_URL#https:}" "$CI_JOB_TOKEN" > .modules/.npmrc
      if (cd .modules && npm install --no-audit --no-fund --no-save @whosit/qes-device); then
        export WHOSIT_QES_DEVICE_MODULE="$PWD/.modules/node_modules/@whosit/qes-device"
      else
        echo "qes-device module not installable — the QES end-to-end tests will skip"
      fi
      rm -f .modules/.npmrc

    # Listed individually rather than via `npm test`, so the job log shows immediately WHICH check
    # failed — a chained command line only says that something did.
    - npm run test:wrp
    - npm run test:hostgate
    - npm run test:netcheck
    - npm run test:startup
    - npm run test:editions
    - npm run test:modules
    - npm run test:webhook
    # Zero retention at the verifier: the session holding the claims is deleted right after use.
    - npm run test:purge
    # Reciprocity in an open room: nobody receives values before they have agreed themselves.
    - npm run test:openroom
    # Operator pages: the imprint belongs to whoever runs the instance.
    - npm run test:operatorpages
    - npm run test:invite
    - npm run test:hostlogin
    - npm run test:qes
    # Device-bound signatures: certificate only for a verified participant, subject from the PID,
    # proof of possession, and a PAdES signature that chains to the demo CA.
    - npm run test:qes-device
    # Signing with a paired phone: single-use token, certificate in the owner's name, relay only.
    - npm run test:qes-pairing
    # EUDI_VERIFIER=none: starts without any verifier, calls anonymous, attributes refused.
    - npm run test:verifier-none

# Secret scanning: the mistake that happens most often when open-sourcing, and the most expensive
# one. Runs over the WHOLE history, not just the diff — a secret in an old commit is just as public
# after going public as one in the current tree.
#
# GIT_DEPTH must be 0: GitLab clones shallow by default, and a shallow clone would scan only the
# most recent commits while reporting success. That is the worst possible outcome for this check —
# green, and blind.
secrets:
  stage: test
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: 0
    GITLEAKS_VERSION: "8.28.0"
  script:
    - >
      curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      | tar -xz gitleaks
    - ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1

# Our commits carry the team identity, never a person's (see scripts/check-commit-identity.mjs).
# Merge requests only: with fast-forward merges, what passes here is exactly what lands on main.
identity:
  stage: test
  before_script: []
  cache: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - node scripts/check-commit-identity.mjs "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# REUSE/SPDX: every file carries a copyright line and a licence ID, and every ID in use has its
# text in LICENSES/. That makes the licensing situation machine-readable — exactly what public
# bodies check during procurement — and it proves file by file that this repository is AGPL only,
# instead of merely asserting it.
reuse:
  stage: test
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  before_script: []
  # No npm cache here. The default cache unpacks .npm/_cacache into the working directory, and
  # `reuse lint` walks the working directory — every cached tarball then counts as a file without
  # a licence header (115 of 304 files, and a red job for a repository that is in fact compliant).
  # The same applies to the jobs below that never call npm.
  cache: []
  script:
    - reuse lint

# SBOM — the bill of materials for our dependencies. Two reasons: the Cyber Resilience Act requires
# it in the technical documentation from 2027-12-11 (CycloneDX or SPDX, at least the direct
# dependencies), and public-sector procurement asks for it. It does not have to be public — kept
# here as a job artefact, available on request.
sbom:
  stage: test
  script:
    - npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 90 days

# ERICA conformance run: the BMI's wallet simulator against a real EUDIPLO and this app. The one
# test with real cryptography — everything in `test` uses a fake verifier. See test/erica/README.md.
#
# Heavy (it builds ERICA from source and starts four containers), so not on every push: nightly on
# a schedule, automatically on merge requests that touch the verifier path, by hand otherwise.
# allow_failure for now: ERICA's checks are maintained by hand and can be wrong themselves. Once it
# has run green for a few weeks, drop allow_failure and it becomes a gate.
#
# Without bind mounts on purpose: in Docker-in-Docker the daemon cannot see this checkout, so the
# compose file bakes the EUDIPLO import and the script into images, and the report is copied out.
erica:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  cache: []
  timeout: 40 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/eudiplo.ts
        - src/credential-profiles.ts
        - src/channel-binding.ts
        - src/server.ts
        - scripts/test-erica.mjs
        - test/erica/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      when: manual
  allow_failure: true
  script:
    - |
      set +e
      docker compose -f test/erica/docker-compose.yml run --build --name erica-runner runner
      status=$?
      mkdir -p test/erica/report
      docker cp erica-runner:/report/. test/erica/report/
      docker compose -f test/erica/docker-compose.yml logs --no-color erica eudiplo app app-bound > test/erica/report/stack.log 2>&1
      exit $status
  artifacts:
    when: always
    reports:
      junit: test/erica/report/junit.xml
    paths:
      - test/erica/report/
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────────────────────────────────
# The core image: AGPL code only, so it may be redistributed. Checked rather than asserted: no
# file in it may carry the commercial licence identifier.
#
# NOTE: the job cannot be called `image` — that is a reserved GitLab CI keyword.
container:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  cache: []
  script:
    # The revision label is for images built FROM this one: version.json says which commit runs with
    # seven characters, the tags carry eight, and an image that wants to mirror this tag needs the
    # full revision to derive it. Standard OCI label, readable with `docker inspect`.
    - docker build --build-arg SOURCE_COMMIT="$CI_COMMIT_SHORT_SHA" --label org.opencontainers.image.revision="$CI_COMMIT_SHA" -t evc:core .
    - COUNT=$(docker run --rm evc:core sh -c 'grep -rlE --exclude-dir=node_modules "SPDX-License-Identifier.{1,4}LicenseRef-Commercial" /app 2>/dev/null | wc -l')
    # Single-quoted as ONE YAML scalar: an unquoted ": " inside a plain scalar makes YAML read the
    # item as a mapping, and the whole pipeline fails as "yaml invalid" with 0 jobs.
    - 'echo "Commercially licensed files in the image: $COUNT"'
    - test "$COUNT" -eq 0 || { echo "The core image contains commercially licensed code"; exit 1; }
    # ── publish, on the default branch only ──────────────────────────────────────────────
    # BUILD ONCE, DEPLOY THAT. Until now every instance was built from source by its own
    # deployment, which is how lhd.id-call.eu ended up four releases behind while reporting
    # success: a build that is skipped looks identical to a build that ran. A pushed, immutable
    # tag removes the question — either an instance runs this tag or it does not, and
    # `npm run check:instances` can tell from outside which it is.
    #
    # One image since pro/ left the repository. Instances build FROM a commit tag of it and add
    # their modules (instance repositories); `stable` remains for whoever follows the latest.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag evc:core "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker tag evc:core "$CI_REGISTRY_IMAGE:stable"
        docker push "$CI_REGISTRY_IMAGE:stable"
        echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA (and :stable)"
      else
        echo "Not the default branch — built and checked, not published."
      fi

# ─────────────────────────────────────────────────────────────────────────────────────────
# Rebuild the images built FROM this one. An operator who adds modules to the core keeps an image
# of their own; without this it would go on carrying the previous core until someone remembers.
#
# Configured, not named here: DOWNSTREAM_TRIGGER_URL (a pipeline trigger endpoint,
# https://gitlab.com/api/v4/projects/<id>/trigger/pipeline) and DOWNSTREAM_TRIGGER_TOKEN (that
# project's trigger token, Masked + Protected). Without both the job does not run. The downstream
# pipeline gets CORE_TAG — the tag just published — and PUBLISH_STABLE=ja, since that tag is now
# also `stable`.
downstream:
  stage: betrieb
  image: curlimages/curl:8.10.1
  needs: [container]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOWNSTREAM_TRIGGER_URL && $DOWNSTREAM_TRIGGER_TOKEN
  before_script: []
  cache: []
  script:
    - >-
      curl -fsS -X POST
      --form "token=$DOWNSTREAM_TRIGGER_TOKEN"
      --form "ref=main"
      --form "variables[CORE_TAG]=$CI_COMMIT_SHORT_SHA"
      --form "variables[PUBLISH_STABLE]=ja"
      "$DOWNSTREAM_TRIGGER_URL" > /dev/null
    - 'echo "Triggered the downstream image build for $CI_COMMIT_SHORT_SHA"'

# ─────────────────────────────────────────────────────────────────────────────────────────
# Do the instances we run actually run what we shipped?
#
# The job that would have caught the thing nobody caught: on 2026-09-15 lhd.id-call.eu was found
# serving a build from 15 August. Nothing had failed loudly — one webhook, one skipped build step,
# and an instance that stayed green while going stale. With a paid white-label offering, "updates
# reach every instance" IS the product, so it gets checked rather than assumed.
#
# Needs the variable EUDI_INSTANCES (comma-separated base URLs, Protected). Deliberately NOT in
# the repository: which customers run an instance is business data and this repository is
# mirrored publicly.
#
# Runs on a SCHEDULE, not on every push — right after a deploy an instance is legitimately still
# restarting, and a job that cries wolf gets ignored. Set one up under CI/CD → Schedules; without
# a schedule this job never runs at all.
instanzen:
  stage: betrieb
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script: []
  cache: []
  script:
    - test -n "$EUDI_INSTANCES" || { echo "EUDI_INSTANCES is not set — nothing to check. Add it under Settings → CI/CD → Variables (Protected)."; exit 1; }
    - npm run check:instances

# The REQUEST the live verifier hands to wallets, checked by ERICA: access certificate in the JAR,
# signature, x509_hash, registration certificate, DCQL. That is where the live breakages of
# October 2026 were (a revoked access certificate, a WRPRC not bound to it), and check:instances
# cannot see them. Validation only — nothing is presented, the session is deleted again.
#
# Needs EUDIPLO_LIVE_URL, EUDIPLO_LIVE_CLIENT_ID and EUDIPLO_LIVE_CLIENT_SECRET (Masked +
# Protected; a client of its own with presentation:request and presentation:manage, not the app's,
# whose secret the app may rotate). Optional: EUDIPLO_LIVE_REQUEST_ID. Without them it does not run.
erica-live:
  stage: betrieb
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  cache: []
  timeout: 30 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $EUDIPLO_LIVE_URL && $EUDIPLO_LIVE_CLIENT_ID && $EUDIPLO_LIVE_CLIENT_SECRET
  allow_failure: true
  script:
    - |
      set +e
      docker compose -f test/erica/docker-compose.yml --profile live run --build --name erica-runner runner-live
      status=$?
      mkdir -p test/erica/report
      docker cp erica-runner:/report/. test/erica/report/
      exit $status
  artifacts:
    when: always
    reports:
      junit: test/erica/report/junit.xml
    paths:
      - test/erica/report/
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────────────────────────────────
# The version stamp is NOT written by CI — it is committed, and this job only checks that nobody
# forgot to: public/version.json must carry the version from package.json.
#
# It used to be a job that bumped the version and pushed the result back. That needs a token with
# write access to the repository, and on GitLab.com that means a Project Access Token — a paid
# feature. A personal token would work but is account-wide and expires within a year, and an
# expired token means the stamp stops silently. That failure mode has already cost this project
# two weeks of a deployment quietly serving stale code. A check cannot rot.
#
# The commit SHA is a separate matter: it cannot be known before the commit exists, so no committed
# file can carry it. The Dockerfile re-stamps it at build time from SOURCE_COMMIT (see there) — the
# footer of a running instance therefore shows the revision that was actually deployed.
#
# Releasing is manual and takes two commands:
#   npm version <patch|minor|major> --no-git-tag-version
#   npm run version:stamp
version:
  stage: test
  before_script: []
  cache: []
  script:
    - |
      node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const stamp = JSON.parse(fs.readFileSync('public/version.json', 'utf8'));
        if (stamp.version === pkg.version) {
          console.log('version.json matches package.json:', pkg.version);
          process.exit(0);
        }
        console.error('package.json says ' + pkg.version + ', public/version.json says ' + stamp.version);
        console.error('Fix: npm run version:stamp, then commit public/version.json');
        process.exit(1);
      "
