# coturn — TURN relay for whosit (self-host).
# Static, non-secret tuning only. realm, static-auth-secret and external-ip are
# injected on the command line from your .env (see docker-compose.yml) so no secret
# is ever committed here.

# STUN/TURN listener (UDP + TCP). Open these on your firewall.
listening-port=3478

# TURN REST API: the app derives short-lived (time-limited) credentials from the
# shared secret, so no long-term username/password is stored anywhere.
use-auth-secret

# Relay port range handed out for media. Open this UDP range on your firewall,
# and keep it in sync with any cloud security group.
min-port=49160
max-port=49200

# TLS/DTLS (TURNS on 5349) is OFF by default: WebRTC media is already DTLS-SRTP
# encrypted end-to-end, so plain TURN is fine for confidentiality. Enable TURNS only
# if you need to traverse TLS-only firewalls — see the TURN section of the README.
no-tls
no-dtls
fingerprint

# Hardening: relay only, no reaching internal/loopback/multicast ranges.
no-multicast-peers
no-cli
no-software-attribute
# Deny relaying to private/link-local ranges (defence-in-depth against SSRF-style abuse).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Logs to stdout so `docker compose logs coturn` just works.
log-file=stdout
