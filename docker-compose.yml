# Self-hosting stack for whosit (Community Edition).
#
#   app     — the Node.js signaling/app server (built from ./Dockerfile)
#   traefik — reverse proxy: HTTP→HTTPS, Let's Encrypt certs, WSS routing
#   coturn  — TURN relay for NAT traversal (media stays DTLS-SRTP encrypted)
#
# Quick start:
#   cp .env.selfhost.example .env    # then edit DOMAIN, ACME_EMAIL, TURN_SECRET, EUDIPLO_*
#   docker compose up -d
#
# Optional EUDIPLO DUMMY for frontend work (no wallet, no cryptography, no substitute for a
# verifier):  docker compose --profile mock up
# See README.md ("Self-hosting in 5 steps") for the full walkthrough.

name: whosit-web

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Traefik reads the container list through the socket proxy below, never the socket itself.
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # force HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (TLS-ALPN-01 challenge — only needs port 443 open)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/acme
    networks: [web, docker-api]
    depends_on: [socket-proxy]

  # Access to the Docker socket is effectively root on the host: the API can start privileged
  # containers, and ":ro" only protects the socket FILE, not the API. Traefik needs nothing but the
  # list of containers and their labels, so it gets exactly that through this proxy (since
  # 2026-11-05; before, the socket was mounted into Traefik directly). The proxy answers GET on
  # /containers and nothing else — no POST, no exec, no images — and sits on a network of its own
  # that has no route out.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  app:
    build: .                      # reuses the existing multi-stage ./Dockerfile
    # Your own imprint, privacy notice and front page belong to you, not to this software — see
    # EUDI_OPERATOR_PAGES in .env.example. Put them in ./pages and uncomment both lines; without
    # them "/" simply opens the call screen.
    # volumes:
    #   - ./pages:/data/pages:ro
    # (and, in the environment block below: EUDI_OPERATOR_PAGES: /data/pages)
    restart: unless-stopped
    expose:
      - "3000"                    # internal only; Traefik terminates TLS and proxies
    # .env is passed in full; the environment block below overrides it (and derives from DOMAIN).
    env_file:
      - path: .env
        required: false
    environment:
      # EUDI_OPERATOR_PAGES: /data/pages   # uncomment together with the ./pages volume above
      PUBLIC_URL: "https://${DOMAIN}"
      PORT: "3000"
      ALLOWED_ORIGINS: "https://${DOMAIN}"
      # community (default) is the full product, group calls included. The commercially licensed
      # features come as modules (EUDI_MODULES, see LICENSE-COMMERCIAL.md); this value only labels
      # the instance in /capabilities.
      EUDI_EDITION: "${EUDI_EDITION:-community}"
      # EUDI_VERIFIER=none: no verifier at all, anonymous calls only (see .env.selfhost.example).
      EUDI_VERIFIER: "${EUDI_VERIFIER:-}"
      EUDI_ALLOW_MOCK_VERIFIER: "${EUDI_ALLOW_MOCK_VERIFIER:-}"
      EUDIPLO_BASE_URL: "${EUDIPLO_BASE_URL:-}"
      EUDIPLO_ROOT_ID: "${EUDIPLO_ROOT_ID:-}"
      EUDIPLO_ROOT_SECRET: "${EUDIPLO_ROOT_SECRET:-}"
      EUDIPLO_CLIENT_ID: "${EUDIPLO_CLIENT_ID:-}"
      # The recommended access path (a fixed tenant client); the ROOT pair above is legacy.
      EUDIPLO_CLIENT_SECRET: "${EUDIPLO_CLIENT_SECRET:-}"
      # Without a trust list EUDIPLO rejects every presentation (see .env.example).
      EUDI_TRUST_LIST_IDS: "${EUDI_TRUST_LIST_IDS:-}"
      # Your TURN relay; the app mints ephemeral TURN-REST credentials from TURN_SECRET
      # (see README.md → "Wiring up TURN properly").
      TURN_URL: "turn:${DOMAIN}:3478"
      TURN_SECRET: "${TURN_SECRET:?set TURN_SECRET in .env (openssl rand -hex 32)}"
      STUN_URLS: "${STUN_URLS:-}"
      TURN_PUBLIC_FALLBACK: "${TURN_PUBLIC_FALLBACK:-}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=le
      - traefik.http.services.app.loadbalancer.server.port=3000
    networks: [web]
    depends_on: [traefik]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # TURN needs the host network so relayed media reaches the real public IP and
    # the UDP relay port range is directly reachable.
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Static tuning lives in the conf; secret/realm/IP are injected from .env here so
    # no secret is committed. Open UDP 3478 + 49160-49200 (and TCP 3478) on the firewall.
    command: >
      -c /etc/coturn/turnserver.conf
      --realm=${DOMAIN}
      --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env (openssl rand -hex 32)}
      --external-ip=${TURN_EXTERNAL_IP}

  # --- optional: EUDIPLO DUMMY (`--profile mock`) ---
  # For frontend work only. No signature verification, and it returns claims that were never
  # requested — which keeps protocol errors invisible. Production needs your own EUDIPLO instance
  # with an access certificate (see the README).
  mock-eudiplo:
    profiles: ["mock"]
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "8080"
      SELF_URL: "https://${DOMAIN}/mock"
      WEBHOOK_ORIGINS: "https://${DOMAIN}"
    volumes:
      - ./deploy/mock-eudiplo:/app:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.mock.rule=Host(`${DOMAIN}`) && PathPrefix(`/mock`)
      - traefik.http.routers.mock.entrypoints=websecure
      - traefik.http.routers.mock.tls.certresolver=le
      - traefik.http.middlewares.mock-strip.stripprefix.prefixes=/mock
      - traefik.http.routers.mock.middlewares=mock-strip
      - traefik.http.services.mock.loadbalancer.server.port=8080
    networks: [web]

volumes:
  traefik-acme:

networks:
  web:
    driver: bridge
  docker-api:
    internal: true
