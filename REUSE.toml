# SPDX-FileCopyrightText: 2026 Kontrollfeld GmbH
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Licence information for files that cannot carry comments (JSON) or that are generated.
# REUSE specification 3.3, section "REUSE.toml" — this replaces the former `.license` companion
# files and keeps the information in one place.
#
# Check with:  pipx run 'reuse[charset-normalizer]' lint

version = 1

[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "credential-catalog.json",
  "signature-providers.json",
  "public/translations.json",
]
SPDX-FileCopyrightText = "2026 Kontrollfeld GmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by scripts/gen-version.mjs on every build — the content is pure metadata.
[[annotations]]
path = "public/version.json"
SPDX-FileCopyrightText = "2026 Kontrollfeld GmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Commercially licensed (see pro/LICENSE and
# LICENSES/LicenseRef-Commercial-EUDI-Verified-Call.txt).
[[annotations]]
path = ["pro/package.json", "pro/package-lock.json", "pro/tsconfig.json"]
SPDX-FileCopyrightText = "2026 Kontrollfeld GmbH"
SPDX-License-Identifier = "LicenseRef-Commercial-EUDI-Verified-Call"

# Third-party components with their own licences — the texts sit next to the files themselves,
# with an overview in NOTICE.
[[annotations]]
path = "public/vendor/pdfjs/**"
SPDX-FileCopyrightText = "Mozilla Foundation and contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "public/vendor/pkijs/**"
SPDX-FileCopyrightText = "2014 GlobalSign, 2015-2019 Peculiar Ventures"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "public/vendor/signpdf/**"
SPDX-FileCopyrightText = "2019 The Authors, 2019 Andrew Dillon"
SPDX-License-Identifier = "MIT"

# Self-hosted fonts: IBM Plex Sans, so that no request goes to a font CDN.
[[annotations]]
path = "public/fonts/**"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

# Public Apple intermediate certificate, required for wallet passes. Not a secret.
[[annotations]]
path = "assets/pass/**"
SPDX-FileCopyrightText = "Apple Inc."
SPDX-License-Identifier = "LicenseRef-Apple-WWDR-Certificate"

# Documentation and community files. Markdown could only carry the tags as HTML comments, which
# would sit at the very top of the rendered README — recorded here instead so the information stays
# in one place.
[[annotations]]
path = [
  "README.md",
  "NOTICE",
  "CLA.md",
  ".github/CODE_OF_CONDUCT.md",
  ".github/CONTRIBUTING.md",
  ".github/SECURITY.md",
  ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "2026 Kontrollfeld GmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"
